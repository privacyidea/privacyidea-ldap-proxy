name: Python distributions

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - '!v*dev*'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-dist:
    name: Build and check Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build a wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist/
      - name: Check package metadata and description
        run: python -m twine check --strict dist/*
      - name: Check package contents and release version
        run: python .github/scripts/check_distribution.py
      - name: Store the checked distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish Python distributions to PyPI
    if: >-
      github.repository == 'privacyidea/privacyidea-ldap-proxy' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: build-dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pi-ldapproxy/
    permissions:
      id-token: write
    steps:
      - name: Download the checked distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-dist
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
